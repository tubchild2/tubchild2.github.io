<!DOCTYPE html>
<html lang = "en">
	<head>
		<meta charset = "UTF-8">
		<title>Map Generation Experiment</title>
		<link rel="stylesheet" href="../../styles/mapGen.css">
        <link rel="icon" type="image/png" href="../../media/Styling/Arcohaem Favicon.png">
	</head>
	<body>
        <div id="page">
            <div>
                <a href = "../Arcohaem-landing.html">Back to Arcohaem Landing</a>
            </div>
            <div>
                <div id="mouse-pos"></div>
                <div id="transformed-mouse-pos"></div>
                
            </div>
            <div id="main_page">
                <div id="div_header">
                    <h1>Map Generation Experiment</h1>
                    <p>
                        For generating randomized maps. 
                    </p>
                </div>

                <div id="div_content" style="display:flex;">
                    <div id="div_settings" class="box">
                        <div id="div_settings">
                            <h3>Settings</h3>
                            <table>
                                <tr>
                                    <td class="column_label">Height</td>
                                    <td class="column_input"><input type=number id="input_height"></td>

                                    <td class="column_label">Width</td>
                                    <td class="column_input"><input type=number id="input_width"></td>
                                </tr>
                                <tr>
                                    <td class="column_label">Scale</td>
                                    <td class="column_input"><input type=number id="input_scale"></td>

                                    <td class="column_label">W Lvl</td>
                                    <td class="column_input"><input type=number id="input_water_level"></td>
                                </tr>
                                <tr>
                                    <td class="column_label">Layer Size</td>
                                    <td class="column_input"><input type=number id="input_layers"></td>

                                    <td class="column_label">Layer Vis</td>
                                    <td class="column_input"><input type=number id="input_layer_visibility"></td>
                                </tr>
                                <tr>
                                    <td class="column_label">Island</td>
                                    <td class="column_input"><input type=checkbox id="input_island"></td>
                                </tr>

                                <!--OCTAVE SETTINGS-->
                                <tr>
                                    <td><p></p></td> 
                                </tr>
                                <tr>
                                    <td class="column_label">Octaves</td>
                                    <td class="column_input"><input type=number id="input_octaves"></td>
                                </tr>
                                <tr>
                                    <td class="column_label">O.+Scale</td>
                                    <td class="column_input"><input type=number id="input_octave_scale"></td>
                                </tr>
                                <tr>
                                    <td class="column_label">O.+Vis</td>
                                    <td class="column_input"><input type=number id="input_octave_visibility"></td>
                                </tr>
                            </table>
                        </div>

                        <div id="div_controls">
                            <h3>Controls</h3>
                            <button id="button_start">Start</button>
                            <button id="button_reset">Reset</button>
                            <button id="button_center">Center</button>
                        </div>

                        <div>
                            <h3>Stats</h3>
                            <table>
                                <tr>
                                    <td class="column_label">X</td>
                                    <td class="column_output" id="output_x">val</td>
                                </tr>
                                <tr>
                                    <td class="column_label">Y</td>
                                    <td class="column_output" id="output_y">val</td>
                                </tr>
                                <tr>
                                    <td class="column_label">Z</td>
                                    <td class="column_output" id="output_z">val</td>
                                </tr>
                                <tr>
                                    <td class="column_label">Cells</td>
                                    <td class="column_output" id="output_cells">val</td>
                                </tr>
                                <tr>
                                    <td class="column_label">LOD</td>
                                    <td class="column_output" id="output_LOD">val</td>
                                </tr>
                            </table>
                        </div>
                    </div>
                    <div id="div_canvas">
                        <canvas id="canvas_map" width="1920" height="1080"></canvas>
                    </div>
                </div>
            </div>
        </div>
	</body>
</html>
<script src="../../scripts/mapGen.js"></script>
